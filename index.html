<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tik tok web</title>
  
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      body {
        background-color: black;
        color: white;
        font-family: Georgia, 'Times New Roman', Times, serif;
        margin: 0;
        padding: 0;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 40px;
        border-bottom: 1px solid #2f2f2f;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 30px;
        font-weight: bold;
        cursor: pointer;
      }

      .logo i {
        font-size: 40px;
      }
      
      .h-box {
        display: flex;
        align-items: center;
        gap: 20px;
        font-weight: bold;
      }
      
      .h-box p {
        background-color: rgb(48, 41, 41);
        padding: 8px 20px;
        border-radius: 5px;
        cursor: pointer;
        margin: 0;
      }
      
      .h-box p:hover {
        background-color: rgb(70, 60, 60);
      }

      header a {
        background-color: rgb(255, 61, 61);
        border-radius: 5px;
        padding: 8px 30px;
        text-decoration: none;
        color: white;
      }

      header a:hover {
        background-color: rgb(254, 87, 87);
      }
  
      main {
        display: flex;
        justify-content: space-between;
        padding: 40px;
        gap: 40px;
      }
      
      
      .left {
        width: 250px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .left input {
        border: none;
        background-color: rgb(52, 48, 48);
        font-size: 18px;
        border-radius: 20px;
        padding: 12px;
        color: white;
        margin-bottom: 20px;
        text-align: left;
      }
      
      .left h2 {
        font-size: 20px;
        margin: 5px 0;
        cursor: pointer;
        font-weight: normal;
      }

      .left h2:hover {
        color: rgb(254, 87, 87);
      }

      hr {
        border: 0;
        border-top: 1px solid #2f2f2f;
        width: 100%;
        margin: 2px 0;
      }

      .left-login-btn {
        font-size: 18px;
        border: none;
        border-radius: 5px;
        background-color: rgb(254, 87, 87);
        color: white;
        padding: 12px;
        cursor: pointer;
        margin-top: 15px;
        width: 100%;
      }
      
    
      .video-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .user-profile-header {
        display: flex;
        align-items: center;
        gap: 15px;
        width: 400px;
        margin-bottom: 15px;
      }

      .pro {
        width: 45px;
        height: 45px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid #2f2f2f;
      }

      .username {
        font-weight: bold;
        font-size: 18px;
      }

      .video-placeholder {
        width: 400px;
        height: 550px;
        background-color: #121212;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid #2f2f2f;
      }

      .main-video-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      
      .interaction-buttons {
        display: flex;
        flex-direction: column; 
        justify-content: flex-end; 
        gap: 20px;
        margin-bottom:100px;
        width: 80px;
      }
      #img{
        padding: 2px;
        border: 3px solid;
          border-radius: 50%; 
        border-left-color: greenyellow;
        border-top: green;
        border-right-color: yellow;
        border-bottom: #fe2c55;
        margin-bottom: 6px;
        width: 50px;
        height: 50px;
      }
      .action-box {
        display: flex;
        flex-direction: column; 
        align-items: center; 
        cursor: pointer;
      }

      .action-box i {
        background-color: rgb(52, 48, 48);
        padding: 15px;
        border-radius: 50%; 
        font-size: 22px;
        margin-bottom: 6px;
        width: 25px;
        height: 25px;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: background 0.2s, color 0.2s;
      }

      
      .action-box:hover i {
        background-color: rgb(80, 75, 75);
      }

      .action-box:hover .fa-heart {
        color: #fe2c55; 
      }
      .action-box:hover .fa-link{
        color: rgb(14, 14, 180);
      }
      .action-box span {
        font-size: 13px;
        color: #b3b3b3;
      }
    </style>
  </head>
  <body>

  
    <header>
      <div class="logo">
         <i class="fab fa-tiktok" style="color: white;"></i> <span>TikTok</span>
      </div>
      <div class="h-box">
        <p>Get coins</p>
        <p>Get app</p>
        <a href="https://BKcoder11.github.com">Log in</a>
      </div>
    </header>

    
    <main>
    
      <div class="left">
        <input type="text" placeholder="Search" />
        <h2>For You</h2> <hr>
        <h2>Explore</h2> <hr>
        <h2>Following</h2> <hr>
        <h2>Short dramas</h2> <hr>
        <h2>Live</h2> <hr>
        <h2>Upload</h2> <hr>
        <h2>Profile</h2> <hr>
        <h2>... More</h2> <hr>
      <button class="left-login-btn">Log in</button>
      </div>

  
      <div class="video-container">
         
         <div class="video-placeholder">
          
            <img src="images/program.png" alt="no photo" class="main-video-img">
         </div>
      </div>
      <div class="interaction-buttons">
        <div class="action-box">
          <img src="images/program.png" alt="no img" id="img">
        </div>
         <div class="action-box">
            <i class="fas fa-heart"></i>
            <span>Like</span>
         </div>
         <div class="action-box">
            <i class="fas fa-comment-dots"></i>
            <span>Comment</span>
         </div>
         <div class="action-box">
            <i class="fas fa-share"></i>
            <span>Share</span>
         </div>
         <div class="action-box">
            <i class="fas fa-link"></i>
            <span>Link</span>
         </div>
      </div>
    </main>

  </body>
</html>
